[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sr1egamebot"
version = "0.1.0"
description = "Python port of SR1eGameBot"
readme = "README_PYTHON.md"
requires-python = ">=3.11,<4"
dependencies = [
  "discord.py>=2.6,<3",
  "pymongo>=4.19,<5",
  "cryptography>=45,<47",
]

[project.scripts]
sr1egamebot = "sr1egamebot.__main__:main"

[project.optional-dependencies]
test = []

[tool.setuptools.packages.find]
include = ["sr1egamebot*"]
